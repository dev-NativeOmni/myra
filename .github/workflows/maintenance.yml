name: Daily Maintenance

# Replaces the server cron: prunes old audit logs (model:prune) and, by querying
# the database every day, keeps the free Supabase project from being paused.
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 WIB
  workflow_dispatch:

jobs:
  maintenance:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, zip, intl, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --ignore-platform-req=ext-gd

      - name: Prune old records
        env:
          DB_CONNECTION: pgsql
          DB_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DB_SSLMODE: require
          CACHE_STORE: array
        run: php artisan model:prune --no-interaction
