name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'
  # Pinned so a new CLI release cannot break a deploy overnight; bump deliberately.
  VERCEL_CLI_VERSION: '63.1.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Tests run on Postgres, the same database engine as production (Supabase).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, gd, zip, intl, pdo_pgsql, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fails fast on formatting before spending time on npm and the test suite.
      # Run `vendor/bin/pint --dirty` locally before pushing to avoid this.
      - name: Check code style
        run: vendor/bin/pint --test

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

  deploy:
    needs: test
    # Deploy only from main, and only once Vercel and Supabase are set up (repo variable DEPLOY_ENABLED=true).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, zip, intl, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-dev --ignore-platform-req=ext-gd
          npm ci
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DB_SSLMODE: require
          CACHE_STORE: array
        run: php artisan migrate --force --no-interaction

      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Catches a deploy that went live but cannot boot (missing env var, bad config).
      - name: Smoke test production
        if: vars.PRODUCTION_URL != ''
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_URL }}/up
        run: curl -fsS --max-time 20 --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$HEALTH_URL"
